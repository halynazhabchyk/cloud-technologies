openapi: 3.0.3

info:
  title: Distributed Key-Value Store API
  version: 4.0.0
  description: >
    REST API for managing table definitions and key-value records
    in a distributed storage system. The coordinator exposes the API,
    registers storage shards and their replicas, and routes record
    operations to the appropriate shard based on the record key. Each
    shard is a replica set: a leader that accepts writes and followers
    that replicate its log and serve reads.

    Every request may carry an X-Trace-Id header (one is generated
    otherwise); the same ID is returned in the response header, passed to
    every replica involved and written to all log lines. Errors use one
    format: {"error": "...", "trace_id": "..."}. Every write is versioned
    with a timestamp; conflicting writes are resolved by Last-Write-Wins.

servers:
  - url: http://localhost:8000
    description: Local coordinator

tags:
  - name: Tables
    description: Table definition management
  - name: Records
    description: Key-value record operations
  - name: Shards
    description: Storage shard registration and discovery
  - name: Health
    description: Service health checks and build version
  - name: Cluster
    description: Monitoring discovery and background rebalancing

paths:
  /tables:
    post:
      tags:
        - Tables
      summary: Create a table definition
      operationId: createTable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableDefinition'
            example:
              tableName: users
              partitionKey: userId
      responses:
        '201':
          description: Table definition created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: A table with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

    get:
      tags:
        - Tables
      summary: List table definitions
      operationId: listTables
      responses:
        '200':
          description: Registered table definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TableDefinition'

  /tables/{tableName}:
    parameters:
      - $ref: '#/components/parameters/TableName'

    get:
      tags:
        - Tables
      summary: Get a table definition
      operationId: getTable
      responses:
        '200':
          description: Table definition retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDefinition'
        '404':
          $ref: '#/components/responses/NotFound'

  /tables/{tableName}/items/{partitionKey}:
    parameters:
      - $ref: '#/components/parameters/TableName'
      - $ref: '#/components/parameters/PartitionKey'

    put:
      tags:
        - Records
      summary: Create or replace a record
      operationId: putRecord
      description: >
        Creates a record or replaces the existing record identified by
        its partition key and, when configured for the table, sort key.
        The coordinator determines the responsible shard and forwards
        the write operation to that shard's leader. The leader appends
        the write to its replication log and answers once WRITE_QUORUM
        replicas (itself included) hold it. The sortKey parameter must
        be provided when the table defines a sort key. The response
        identifies the shard, the version (log offset) and the
        Last-Write-Wins timestamp of the write. The coordinator stamps the
        write with its clock unless X-Write-Timestamp is given; a write
        older than the stored version (or tombstone) is rejected with 409.
      parameters:
        - $ref: '#/components/parameters/SortKey'
        - $ref: '#/components/parameters/WriteTimestamp'
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Record'
            example:
              value:
                name: Alex
                email: alex@example.com
      responses:
        '201':
          description: Record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordWriteResponse'
        '200':
          description: Existing record replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordWriteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/WriteConflict'
        '503':
          description: >
            No available shard can handle the request, or the write/read
            quorum was not reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


    get:
      tags:
        - Records
      summary: Read one record by key or all records in a partition
      operationId: readRecords
      description: >
        With sortKey, reads exactly one record identified by its full key
        (partition key + sort key) and returns 404 when it does not exist.
        Without sortKey, reads all records that share the partition key
        and returns an empty list when the partition has no records.
        In both cases the coordinator identifies the responsible shard by
        the partition key, asks READ_QUORUM of its replicas (round-robin,
        so reads are spread over all live replicas) and returns the answer
        of the replica that has applied the most of the log. sortKey must
        be omitted for tables without a sort key. While background
        rebalancing moves records, a miss on the new owner is retried on
        the previous owner.
      parameters:
        - $ref: '#/components/parameters/SortKey'
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: >
            The record (when sortKey is given) or the records in the partition
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RecordReadResponse'
                  - $ref: '#/components/schemas/PartitionReadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: >
            No available shard can handle the request, or the write/read
            quorum was not reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Records
      summary: Delete a record
      operationId: deleteRecord
      description: >
        Deletes a record identified by its partition key and, when
        configured for the table, sort key. The coordinator routes
        the operation to the responsible shard. Replicas keep a tombstone
        with the delete's timestamp, so a delayed older write cannot bring
        the record back.
      parameters:
        - $ref: '#/components/parameters/SortKey'
        - $ref: '#/components/parameters/WriteTimestamp'
        - $ref: '#/components/parameters/TraceId'
      responses:
        '204':
          description: Record deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/WriteConflict'
        '503':
          description: >
            No available shard can handle the request, or the write/read
            quorum was not reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    head:
      tags:
        - Records
      summary: Check whether a record exists
      operationId: recordExists
      description: >
        Checks whether a record exists without returning its value.
        Returns 200 when the record exists and 404 when the table
        or record is not found. The sortKey parameter must be
        provided when the table defines a sort key.
      parameters:
        - $ref: '#/components/parameters/SortKey'
      responses:
        '200':
          description: Record exists
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: >
            No available shard can handle the request, or the write/read
            quorum was not reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /shards:
    post:
      tags:
        - Shards
      summary: Register a storage shard
      operationId: registerShard
      description: >
        Registers one replica of a shard with the coordinator. Every
        replica registers at startup with its shard, replica identifier,
        role and internal base URL, and re-registers if the coordinator
        forgets it (for example after a coordinator restart).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShardRegistration'
            example:
              shardId: shard-1
              replicaId: shard-1-b
              role: follower
              baseUrl: http://shard1-b:8000
      responses:
        '201':
          description: Replica registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShardRegistration'
        '409':
          description: >
            The replica is already registered, its identifier is taken by
            another URL or role, or the shard already has a leader
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

    get:
      tags:
        - Shards
      summary: List registered shards and their replicas
      operationId: listShards
      responses:
        '200':
          description: Registered shards with their replica sets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Shard'

  /health:
    get:
      tags:
        - Health
      summary: Coordinator health check
      operationId: health
      description: >
        Liveness check used by Docker Compose and deployment smoke tests.
        Always 200 while the process works; "ready" tells whether record
        requests can be served and "status" is "degraded" when some replica
        fails its background health check. Every replica has its own
        /health with its role, applied offset, key count and lag.
      responses:
        '200':
          description: Coordinator is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /version:
    get:
      tags:
        - Health
      summary: Build version
      operationId: version
      description: >
        Version and git commit of the running image (Docker build
        arguments GIT_SHA and BUILD_TIME). Replicas expose the same endpoint.
      responses:
        '200':
          description: Build information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildInfo'

  /rebalance:
    get:
      tags:
        - Cluster
      summary: Progress of the last background rebalancing
      operationId: rebalanceStatus
      responses:
        '200':
          description: Rebalancing status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebalanceStatus'

  /rebalance/{shardId}:
    post:
      tags:
        - Cluster
      summary: Repeat rebalancing for a shard
      operationId: startRebalance
      description: >
        Rebalancing starts by itself when a new shard's leader registers on
        a ring that already has two shards; this endpoint repeats it, for
        example after a run that ended with errors.
      parameters:
        - name: shardId
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Rebalancing scheduled
        '404':
          $ref: '#/components/responses/NotFound'

  /internal/prometheus-targets:
    get:
      tags:
        - Cluster
      summary: Replicas to scrape (Prometheus HTTP service discovery)
      operationId: prometheusTargets
      responses:
        '200':
          description: One target group per registered replica
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    targets:
                      type: array
                      items:
                        type: string
                      example: ["shard1-a:8000"]
                    labels:
                      type: object
                      additionalProperties:
                        type: string
                      example:
                        shard: shard-1
                        replica: shard-1-a
                        role: leader

components:
  parameters:
    TableName:
      name: tableName
      in: path
      required: true
      description: Name of the registered table
      schema:
        type: string
        minLength: 1
        maxLength: 128

    PartitionKey:
      name: partitionKey
      in: path
      required: true
      description: Value of the record's partition key
      schema:
        type: string
        minLength: 1
        maxLength: 512

    SortKey:
      name: sortKey
      in: query
      required: false
      description: >
        Value of the sort key. Required when the table definition
        specifies a sortKey; must be omitted otherwise.
      schema:
        type: string
        minLength: 1
        maxLength: 512

    WriteTimestamp:
      name: X-Write-Timestamp
      in: header
      required: false
      description: >
        Last-Write-Wins timestamp of the write in microseconds since the Unix
        epoch. Normally omitted: the coordinator uses its own clock. Setting
        it imitates a client or coordinator with a different clock.
      schema:
        type: integer
        format: int64
        minimum: 1

    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      description: >
        Trace ID of the request (1-64 characters: letters, digits, '.', '_',
        '-'). Generated when missing; returned in the response header.
      schema:
        type: string
        maxLength: 64

  schemas:
    TableDefinition:
      type: object
      required:
        - tableName
        - partitionKey
      properties:
        tableName:
          type: string
          minLength: 1
          maxLength: 128
          description: Unique table name
        partitionKey:
          type: string
          minLength: 1
          maxLength: 128
          description: Attribute used as the partition key
        sortKey:
          type: string
          minLength: 1
          maxLength: 128
          description: >
            Optional attribute used as a secondary key within
            a partition. Its use is an extended feature.

    Record:
      type: object
      required:
        - value
      properties:
        value:
          type: object
          additionalProperties: true
          description: JSON object containing the record data

    RecordWriteResponse:
      type: object
      required:
        - value
        - shardId
      properties:
        value:
          type: object
          additionalProperties: true
          description: JSON object containing the written record data
        shardId:
          type: string
          nullable: true
          description: Shard that accepted the write, or null in single-node mode
        version:
          type: integer
          nullable: true
          description: >
            Offset of the write in the shard's replication log; it orders all
            writes in the shard. Null in single-node mode.
        timestamp:
          type: integer
          format: int64
          nullable: true
          description: Last-Write-Wins timestamp in microseconds (null in single-node mode)

    PartitionRecord:
      type: object
      required:
        - value
      properties:
        sortKey:
          type: string
          nullable: true
          description: Sort key of the record, or null for tables without a sort key
        value:
          type: object
          additionalProperties: true
          description: JSON object containing the record data
        version:
          type: integer
          nullable: true
          description: Log offset of the last write to this record
        timestamp:
          type: integer
          format: int64
          nullable: true
          description: Last-Write-Wins timestamp in microseconds (null in single-node mode)

    RecordReadResponse:
      type: object
      required:
        - shardId
        - sortKey
        - value
      properties:
        shardId:
          type: string
          nullable: true
          description: Shard that served the read, or null in single-node mode
        replicaId:
          type: string
          nullable: true
          description: Replica whose answer was returned (the freshest of the read quorum)
        sortKey:
          type: string
          nullable: true
          description: Sort key of the record
        value:
          type: object
          additionalProperties: true
          description: JSON object containing the record data
        version:
          type: integer
          nullable: true
          description: Log offset of the last write to this record
        timestamp:
          type: integer
          format: int64
          nullable: true
          description: Last-Write-Wins timestamp in microseconds (null in single-node mode)

    Health:
      type: object
      required:
        - status
        - shardingEnabled
        - registeredShards
      properties:
        status:
          type: string
          enum: [ok, degraded]
        ready:
          type: boolean
          description: True when at least two shards have a leader
        version:
          type: string
          example: 4.0.0
        healthyReplicas:
          type: integer
          description: Replicas that passed the last background health check
        shardingEnabled:
          type: boolean
        registeredShards:
          type: integer
          description: Shards that have a registered leader
        registeredReplicas:
          type: integer
          description: Replicas of all shards known to the coordinator
        replicationFactor:
          type: integer
          description: N, replicas per shard
        writeQuorum:
          type: integer
          description: W, replicas that must confirm a write
        readQuorum:
          type: integer
          description: R, replicas asked on every read
        strongConsistency:
          type: boolean
          description: True when R + W > N

    PartitionReadResponse:
      type: object
      required:
        - shardId
        - records
      properties:
        shardId:
          type: string
          nullable: true
          description: Shard that served the read, or null in single-node mode
        replicaId:
          type: string
          nullable: true
          description: Replica whose answer was returned
        records:
          type: array
          items:
            $ref: '#/components/schemas/PartitionRecord'

    ShardRegistration:
      type: object
      required:
        - shardId
        - baseUrl
      properties:
        shardId:
          type: string
          minLength: 1
          maxLength: 128
          description: Shard (replica set) the replica belongs to
        replicaId:
          type: string
          minLength: 1
          maxLength: 128
          description: Unique replica identifier; defaults to shardId
        role:
          type: string
          enum: [leader, follower]
          default: leader
          description: >
            The leader accepts writes and owns the replication log; followers
            replicate the log and serve reads. One leader per shard.
        baseUrl:
          type: string
          format: uri
          description: Internal base URL used by the coordinator

    Replica:
      type: object
      required:
        - replicaId
        - baseUrl
        - role
        - available
      properties:
        replicaId:
          type: string
        baseUrl:
          type: string
          format: uri
        role:
          type: string
          enum: [leader, follower]
        healthy:
          type: boolean
          description: Result of the last background health check
        available:
          type: boolean
          description: >
            Used by reads: healthy and not skipped after a recent failed request

    Shard:
      type: object
      required:
        - shardId
        - replicas
      properties:
        shardId:
          type: string
        baseUrl:
          type: string
          format: uri
          nullable: true
          description: Leader URL, or null while no leader is registered
        replicas:
          type: array
          items:
            $ref: '#/components/schemas/Replica'

    Error:
      type: object
      required:
        - error
        - trace_id
      properties:
        error:
          type: string
          description: Human-readable error description
        trace_id:
          type: string
          description: Trace ID of the request, to find its log lines

    BuildInfo:
      type: object
      properties:
        service:
          type: string
          example: coordinator
        version:
          type: string
          example: 4.0.0
        gitSha:
          type: string
          example: e4ed66c
        buildTime:
          type: string
          example: "2026-11-11T08:00:00Z"

    RebalanceStatus:
      type: object
      properties:
        state:
          type: string
          enum: [idle, running, done, failed]
        newShard:
          type: string
          nullable: true
        traceId:
          type: string
          nullable: true
          description: Trace ID of all log lines of this rebalancing
        startedAt:
          type: number
          nullable: true
        finishedAt:
          type: number
          nullable: true
        scanned:
          type: integer
          description: Records read from the old shards
        moved:
          type: integer
          description: Records moved to their new owner
        errors:
          type: array
          items:
            type: string

  responses:
    BadRequest:
      description: Invalid request or missing required key component
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Requested table or record not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    WriteConflict:
      description: >
        Last-Write-Wins rejected the write: the stored version (or tombstone)
        has a newer timestamp
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ValidationError:
      description: Request body or parameters failed validation
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Request validation failed
              trace_id:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    location:
                      type: array
                      items:
                        type: string
                    message:
                      type: string
