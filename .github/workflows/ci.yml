name: CI lab 3-4
on:
  push:
    branches: [main, lab3-replication, lab4-monitoring]
    paths:
      - "lab-3-4/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "lab-3-4/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab-3-4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            lab-3-4/requirements-dev.txt
            lab-3-4/coordinator/requirements.txt
            lab-3-4/shard/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r shard/requirements.txt

      - name: Lint and type check
        run: |
          ruff check .
          black --check .
          mypy --ignore-missing-imports --explicit-package-bases common coordinator mcp_server
          (cd shard && MYPYPATH=.. mypy --ignore-missing-imports app)

      - name: Tests
        run: python -m pytest -q

      - name: Compare hashing methods
        run: python -m coordinator.app.sharding.measure_resharding --keys 10000

      - name: Build Docker images
        env:
          GIT_SHA: ${{ github.sha }}
        run: docker compose build

      - name: Smoke test the cluster
        run: |
          set -eu
          docker compose up -d
          trap 'docker compose logs; docker compose down' EXIT
          # 2 shards x 3 replicas must register with the coordinator.
          for attempt in $(seq 1 30); do
            replicas="$(curl -fsS http://localhost:8000/health | jq .registeredReplicas || echo 0)"
            echo "[$attempt] registered replicas: $replicas"
            [ "$replicas" = "6" ] && break
            sleep 2
          done
          [ "$replicas" = "6" ]
          curl -fsS -X POST http://localhost:8000/tables \
            -H 'Content-Type: application/json' \
            -d '{"tableName":"orders","partitionKey":"customerId","sortKey":"orderId"}'
          # W = 2 by default: a 2xx means a follower already holds the write.
          shard="$(curl -fsS -X PUT 'http://localhost:8000/tables/orders/items/c1?sortKey=o1' \
            -H 'Content-Type: application/json' -d '{"value":{"total":10}}' | jq -r .shardId)"
          for _ in 1 2 3; do
            curl -fsS 'http://localhost:8000/tables/orders/items/c1?sortKey=o1' | jq -e '.value.total == 10'
          done
          # Followers catch up: every replica of the shard reports zero lag.
          ports="$([ "$shard" = "shard-1" ] && echo '8011 8012 8013' || echo '8021 8022 8023')"
          sleep 2
          for port in $ports; do
            curl -fsS "http://localhost:$port/health" | jq -e '.appliedOffset == 1'
          done
          # Milestone 4: build version, metrics, Prometheus discovery, trace ID.
          curl -fsS http://localhost:8000/version | jq -e --arg sha "${GITHUB_SHA}" '.gitSha == $sha'
          curl -fsS http://localhost:8000/metrics | grep -q 'kv_requests_total{method="PUT"'
          curl -fsS http://localhost:8000/internal/prometheus-targets | jq -e 'length == 6'
          curl -fsS -D - -o /dev/null -H 'X-Trace-Id: ci-trace-1' http://localhost:8000/tables             | grep -qi 'x-trace-id: ci-trace-1'
