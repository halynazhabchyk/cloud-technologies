name: Deploy lab 2
on:
  push:
    branches: [main]
    paths:
      - "milestone_2/**"
      - ".github/workflows/deploy-lab2.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: deploy-lab2
  cancel-in-progress: false

env:
  APP_DIR: milestone_2
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: milestone_2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            milestone_2/coordinator/requirements.txt
            milestone_2/shard/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r coordinator/requirements.txt -r shard/requirements.txt

      - name: Check coordinator module imports
        run: python -c "import coordinator.app.main; print('coordinator OK')"

      - name: Check shard module imports
        working-directory: milestone_2/shard
        run: python -c "import app.main; print('shard OK')"

      - name: Compare hashing methods
        run: |
          if [ -f coordinator/app/sharding/measure_resharding.py ]; then
            python -m coordinator.app.sharding.measure_resharding --keys 10000
          else
            echo "measure_resharding.py not found, skipping"
          fi

      - name: Build Docker images
        run: docker compose build

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    env:
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send deploy command through SSM
        id: send
        run: |
          set -euo pipefail

          # Скрипт виконується на інстансі від імені root через AWS-RunShellScript.
          # git -c safe.directory оминає помилку "dubious ownership" для /opt/app.
          # ${APP_DIR} підставляється вже тут, на раннері.
          cat > deploy.sh <<EOF
          set -eux
          export HOME=/root
          cd /opt/app
          git -c safe.directory=/opt/app fetch origin main
          git -c safe.directory=/opt/app reset --hard origin/main
          cd /opt/app/${APP_DIR}
          docker compose up -d --build --remove-orphans
          docker compose ps
          EOF

          COMMAND_ID="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "Deploy ${GITHUB_SHA}" \
            --timeout-seconds 900 \
            --parameters "$(jq -n --rawfile script deploy.sh '{commands: [$script]}')" \
            --query 'Command.CommandId' \
            --output text)"

          echo "Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for the command result
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          set -uo pipefail

          # Перевіряємо статус кожні 10 секунд, максимум ~15 хвилин.
          for attempt in $(seq 1 90); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")"
            echo "[$attempt] status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardOutputContent' --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "::error::SSM command finished with status $STATUS"
                echo "----- stdout -----"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardOutputContent' --output text
                echo "----- stderr -----"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardErrorContent' --output text
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "::error::Timed out waiting for the SSM command"
          exit 1