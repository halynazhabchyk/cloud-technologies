name: Deploy staging

on:
  push:
    branches: [main]
    paths:
      - "milestone_2/**"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  COORDINATOR_IMAGE: ${{ vars.COORDINATOR_IMAGE }}
  SHARD_IMAGE: ${{ vars.SHARD_IMAGE }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        working-directory: milestone_2
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --tag "$COORDINATOR_IMAGE:$IMAGE_TAG" coordinator
          docker build --tag "$SHARD_IMAGE:$IMAGE_TAG" shard
          docker push "$COORDINATOR_IMAGE:$IMAGE_TAG"
          docker push "$SHARD_IMAGE:$IMAGE_TAG"

      - name: Deploy through AWS Systems Manager
        working-directory: milestone_2
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          COMPOSE_B64="$(base64 -w 0 docker-compose.aws.yml)"
          COMMANDS="$(jq -cn \
            --arg compose "$COMPOSE_B64" \
            --arg registry "$ECR_REGISTRY" \
            --arg coordinator_image "$COORDINATOR_IMAGE" \
            --arg shard_image "$SHARD_IMAGE" \
            --arg tag "$IMAGE_TAG" \
            --arg region "$AWS_REGION" \
            '{
              DocumentName: "AWS-RunShellScript",
              InstanceIds: [env.EC2_INSTANCE_ID],
              Parameters: {
                commands: [
                  "set -eu",
                  "mkdir -p /opt/kv-store",
                  ("echo " + $compose + " | base64 -d > /opt/kv-store/docker-compose.yml"),
                  ("printf \"COORDINATOR_IMAGE=%s\\nSHARD_IMAGE=%s\\nIMAGE_TAG=%s\\n\" " + $coordinator_image + " " + $shard_image + " " + $tag + " > /opt/kv-store/.env"),
                  ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry),
                  "docker compose --env-file /opt/kv-store/.env -f /opt/kv-store/docker-compose.yml pull",
                  "docker compose --env-file /opt/kv-store/.env -f /opt/kv-store/docker-compose.yml up -d --remove-orphans"
                ]
              }
            }')"
          COMMAND_ID="$(aws ssm send-command --cli-input-json "$COMMANDS" --query "Command.CommandId" --output text)"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text
